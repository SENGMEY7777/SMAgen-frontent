services:
  kairo-api:
    build:
      context: ../Kairo-Backend
      dockerfile: Dockerfile
    env_file:
      - ../Kairo-Backend/.env
    environment:
      # The backend listens on the internal Docker port. The host port below
      # remains available for direct health checks and local debugging.
      PORT: 5000
      NODE_ENV: development
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      APP_URL: http://localhost:${FRONTEND_PORT:-8080}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      # Enable explicit local Desktop output for local development only.
      LOCAL_DESKTOP_OUTPUT: "true"
      # Kairo resolves the Desktop directory from os.homedir().
      HOME: /home/appuser
    # Docker already supervises and restarts this service. Running Node
    # directly avoids PM2 writing runtime files under the unprivileged user.
    command: ["node", "app.js"]
    ports:
      - "${BACKEND_PORT:-8082}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kairo_workspaces:/app/workspaces
      # Map the host Desktop to the container user's Desktop directory.
      # This is intentionally limited to the local Docker development stack.
      - /Users/user/Desktop:/home/appuser/Desktop
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:5000/health',
          (r) => process.exit(r.statusCode < 500 ? 0 : 1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  smagen-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      # The frontend and backend share the default Compose network.
      # Override this only when using a separately deployed backend.
      API_UPSTREAM: ${API_UPSTREAM:-http://kairo-api:5000}
    depends_on:
      kairo-api:
        condition: service_started
    restart: unless-stopped

volumes:
  kairo_workspaces:
    driver: local
